name: Verificar busca de leads

# Roda o código real da busca (OpenStreetMap) dentro de um Chrome, na
# origem do site publicado — exatamente como o celular do usuário faz.
on:
  workflow_dispatch:
  push:
    branches: [claude/zenn-os-build-g2subh]
    paths:
      - 'src/services/osmSearch.ts'
      - 'scripts/check-lead-search.mjs'
      - '.github/workflows/check-lead-search.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências e Chrome
        run: |
          npm ci
          npm i --no-save --no-package-lock playwright@1 esbuild@0
          npx playwright install --with-deps chromium

      - name: Busca real dentro do Chrome
        run: node scripts/check-lead-search.mjs
