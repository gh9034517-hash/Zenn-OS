name: Inspecionar site de referência

# Abre um site de referência num Chrome real e publica prints + relatório
# no branch temporário 'ref-inspect' (para análise; apagado depois).
on:
  workflow_dispatch:
    inputs:
      url:
        description: URL a inspecionar
        required: true
  push:
    branches: [claude/zenn-os-build-g2subh]
    paths:
      - 'scripts/inspect-site.mjs'
      - 'scripts/inspect-bundle.mjs'
      - '.github/workflows/inspect-reference.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Chrome
        run: |
          npm i --no-save --no-package-lock playwright@1
          npx playwright install --with-deps chromium
      - name: Inspecionar
        env:
          URL: ${{ github.event.inputs.url || 'https://webvee-leads-v2.vercel.app' }}
        run: node scripts/inspect-site.mjs "$URL" /tmp/inspect-out
      - name: Arquivos públicos e rotas
        if: always()
        env:
          URL: ${{ github.event.inputs.url || 'https://webvee-leads-v2.vercel.app' }}
        run: node scripts/inspect-bundle.mjs "$URL" /tmp/inspect-out
      - name: Publicar no branch ref-inspect
        if: always()
        run: |
          cd /tmp/inspect-out
          git init -q -b ref-inspect
          git config user.email "actions@github.com"
          git config user.name "inspect"
          git add -A
          git commit -q -m "inspecao" || exit 0
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ref-inspect
